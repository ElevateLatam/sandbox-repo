name: SAInapse Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

env:
  SAINAPSE_API_URL: ${{ secrets.SAINAPSE_API_URL }}
  SAINAPSE_PROJECT_ID: "ALP"

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests with pytest
        run: |
          pytest --json-report --json-report-file=test-results.json --cov=calculator --cov-report=json
        continue-on-error: true
      
      - name: Parse test results
        id: test_results
        run: |
          # Parse pytest JSON report
          TOTAL_TESTS=$(jq '.summary.total // 0' test-results.json)
          PASSED_TESTS=$(jq '.summary.passed // 0' test-results.json)
          FAILED_TESTS=$(jq '.summary.failed // 0' test-results.json)
          SKIPPED_TESTS=$(jq '.summary.skipped // 0' test-results.json)
          DURATION=$(jq '.duration // 0' test-results.json)
          
          # Parse coverage JSON report
          COVERAGE_PERCENT=$(jq '.totals.percent_covered // 0' coverage.json)
          
          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed=$PASSED_TESTS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED_TESTS" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          
          echo "📊 Test Results:"
          echo "  Total: $TOTAL_TESTS"
          echo "  Passed: $PASSED_TESTS"
          echo "  Failed: $FAILED_TESTS"
          echo "  Skipped: $SKIPPED_TESTS"
          echo "  Duration: ${DURATION}s"
          echo "  Coverage: ${COVERAGE_PERCENT}%"
      
      - name: Upload test results to SAInapse
        if: always()
        run: |
          # Build test results payload
          TEST_RESULTS=$(jq -n \
            --arg total "${{ steps.test_results.outputs.total_tests }}" \
            --arg passed "${{ steps.test_results.outputs.passed }}" \
            --arg failed "${{ steps.test_results.outputs.failed }}" \
            --arg skipped "${{ steps.test_results.outputs.skipped }}" \
            --arg duration "${{ steps.test_results.outputs.duration }}" \
            --arg coverage "${{ steps.test_results.outputs.coverage }}" \
            '{
              total_tests: ($total | tonumber),
              passed: ($passed | tonumber),
              failed: ($failed | tonumber),
              skipped: ($skipped | tonumber),
              duration_seconds: ($duration | tonumber),
              coverage_percent: ($coverage | tonumber)
            }')
          
          # Build full payload
          PAYLOAD=$(jq -n \
            --arg project_id "$SAINAPSE_PROJECT_ID" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.sha }}" \
            --argjson results "$TEST_RESULTS" \
            '{
              project_id: $project_id,
              repository: $repo,
              branch: $branch,
              pr_number: (if $pr != "" then ($pr | tonumber) else null end),
              commit_sha: $sha,
              test_results_file: ($results | tostring),
              test_format: "pytest"
            }')
          
          # Upload to SAInapse
          echo "📤 Uploading test results to SAInapse..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$SAINAPSE_API_URL/api/qa-nexus/test-results/upload" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Test results uploaded successfully!"
            echo "$BODY" | jq '.'
            
            # Extract dashboard URL
            DASHBOARD_URL=$(echo "$BODY" | jq -r '.dashboard_url // empty')
            if [ -n "$DASHBOARD_URL" ]; then
              echo "📊 View results: $DASHBOARD_URL"
            fi
          else
            echo "❌ Failed to upload test results (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
      
      - name: Fail if tests failed
        if: steps.test_results.outputs.failed != '0'
        run: |
          echo "❌ ${{ steps.test_results.outputs.failed }} test(s) failed"
          exit 1

